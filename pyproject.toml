[project]
name = "vocal-remover-ai"
version = "0.1.0"
description = "AI-powered vocal removal app for creating instrumentals from audio/video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ttkbootstrap>=2.0.0",
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "ttkbootstrap>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PIE"]
ignore = []

[project.scripts]
vocal-remover-ai = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
